services:
  postgres:
    image: postgres:16
    container_name: drift-postgres
    environment:
      POSTGRES_DB: driftdetector
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d driftdetector"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: